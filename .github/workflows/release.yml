name: Validate and release Android app

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :cipher:library:testDebugUnitTest --stacktrace
      - name: Cipher tooling tests
        run: node --test cipher/tools/tools.test.mjs
      - name: Build debug APK for testing
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: debug-testing-only
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            cipher/library/build/reports/

  device-test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # The API 29 image otherwise requests >7 GB of userdata on hosted runners.
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/

  preview-release:
    needs: [validate, device-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debug-testing-only
          path: apk
      - name: Prepare tested APK and checksum
        run: |
          mv apk/app-debug.apk "indir-gitsin-1.0.${GITHUB_RUN_NUMBER}-preview.apk"
          sha256sum indir-gitsin-*.apk > SHA256SUMS.txt
      - name: Publish test prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-preview
          target_commitish: ${{ github.sha }}
          name: İndir Gitsin 1.0.${{ github.run_number }} — Test
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Ses ve görüntüyü ayrı indirip tek dosyada birleştiren yeni akışın test sürümü.

            **Kurulum:** Aşağıdaki APK'yı indirip kurun. “İndir Gitsin Test” ayrı bir uygulama olarak kurulur; mevcut uygulama ve verileri korunur.
            Bu APK debug anahtarıyla imzalanmış bir ön sürümdür. Sonraki test sürümünü yüklerken yalnızca test uygulamasını kaldırmanız gerekebilir.

            **Otomatik doğrulama:** Kotlin/JUnit ve cipher testleri, Android lint, APK imza kontrolü, Android 10 ve 14 emülatörlerinde gerçek AAC/AVC birleştirme ve çözme testleri.
            **Telefonda deneyin:** 360p ve 1080p video indirin; sesin ve görüntünün tek dosyada bulunduğunu, uygulamadan çıkınca indirme durumunu ve iptali kontrol edin. Gerçek YouTube indirmesi cihazda ayrıca doğrulanmalıdır.

            Commit: ${{ github.sha }}
            Build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            indir-gitsin-*.apk
            SHA256SUMS.txt

  release:
    needs: [validate, device-test]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Prepare existing distribution signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 must contain the existing distribution key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.jks"
      - name: Build signed release
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/distribution.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
      - name: Publish signed APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
