name: Validate and release Android app

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :cipher:library:testDebugUnitTest --stacktrace
      - name: Cipher tooling tests
        run: node --test cipher/tools/tools.test.mjs
      - name: Build debug APK for testing
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: debug-testing-only
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            cipher/library/build/reports/

  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Reserve disk space for emulator userdata
        # Only on this disposable GitHub Linux runner; Android does not use the .NET SDK.
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # API 29 enforces a larger image minimum, so disk space is also reserved above.
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/

  preview-release:
    needs: [validate, device-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debug-testing-only
          path: apk
      - name: Prepare tested APK and checksum
        run: |
          mv apk/app-debug.apk "indir-gitsin-1.0.${GITHUB_RUN_NUMBER}-preview.apk"
          sha256sum indir-gitsin-*.apk > SHA256SUMS.txt
      - name: Publish test prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-preview
          target_commitish: ${{ github.sha }}
          name: İndir Gitsin 1.0.${{ github.run_number }} — Test
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Ses ve görüntüyü ayrı indirip tek dosyada birleştiren yeni akışın test sürümü.

            **Kurulum:** Aşağıdaki APK'yı indirip kurun. “İndir Gitsin Test” ayrı bir uygulama olarak kurulur; mevcut uygulama ve verileri korunur.
            Bu APK debug anahtarıyla imzalanmış bir ön sürümdür. Sonraki test sürümünü yüklerken yalnızca test uygulamasını kaldırmanız gerekebilir.

            **Otomatik doğrulama:** Kotlin/JUnit ve cipher testleri, Android lint, APK imza kontrolü, Android 10 ve 14 emülatörlerinde gerçek AAC/AVC birleştirme ve çözme testleri.
            **Telefonda deneyin:** 360p ve 1080p video indirin; sesin ve görüntünün tek dosyada bulunduğunu, uygulamadan çıkınca indirme durumunu ve iptali kontrol edin. Gerçek YouTube indirmesi cihazda ayrıca doğrulanmalıdır.

            Commit: ${{ github.sha }}
            Build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            indir-gitsin-*.apk
            SHA256SUMS.txt

  release:
    needs: [validate, device-test]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_TEST_BUILD_TYPE: release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Prepare permanent distribution signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Permanent distribution signing key is required."
            exit 1
          fi
          umask 077
          RELEASE_STORE_FILE="$RUNNER_TEMP/distribution.p12"
          echo "RELEASE_STORE_FILE=$RELEASE_STORE_FILE" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
      - name: Build and check signed release
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --stacktrace
      - name: Reserve disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the signed release on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            ./gradlew :app:connectedReleaseAndroidTest --stacktrace
            adb shell am start -W -n com.indirgitsin.app.stable/com.indirgitsin.app.MainActivity
            adb exec-out screencap -p > app/build/reports/release-home.png
      - name: Verify permanent certificate and prepare release assets
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > certificate.txt
          cat certificate.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certificate.txt)
          EXPECTED=$(tr -d '\r\n' < docs/release-certificate.sha256)
          test "$ACTUAL" = "$EXPECTED"
          cp app/build/outputs/apk/release/app-release.apk "indir-gitsin-${GITHUB_REF_NAME#v}.apk"
          python3 tools/package-source.py "indir-gitsin-${GITHUB_REF_NAME#v}-source.zip"
          sha256sum indir-gitsin-*.apk indir-gitsin-*-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-release-validation
          path: |
            app/build/reports/
            app/build/outputs/apk/release/*.apk
            certificate.txt
      - name: Publish signed final APK
        uses: softprops/action-gh-release@v2
        with:
          name: İndir Gitsin ${{ github.ref_name }} — Final
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Final sürüm
            - Video ve ses paralel indirilir, yeniden kodlamadan tek dosyada birleştirilir.
            - İndirme hızı ve tahmini kalan süre gösterilir.
            - Başarısız işler yeniden denenebilir; aynı video ve kalite aktifken tekrar kuyruğa eklenmez.
            - İsteğe bağlı yalnızca tarifesiz ağ ayarı (yeni indirmeler için).
            - Dosyaları tarih/ad/boyuta göre sıralama; dosya ve geçmiş silmeden önce onay.
            - Güncelleme erişim hataları artık yanlışlıkla “güncel” gösterilmez.

            **Kurulum:** APK kalıcı anahtarla imzalanmıştır. `com.indirgitsin.app.stable` kimliğiyle eski/test uygulamalarının yanına kurulur; onları kaldırmanız gerekmez. Ayarlar ve geçmiş ayrı başlar. Sonraki final sürümleri aynı anahtarla bunun üzerine güncellenebilir.
            Önceki uygulamanın dosyaları telefonda korunur; Android izinleri nedeniyle final uygulamasında hepsi otomatik görünmeyebilir.

            **Doğrulama:** Birim testleri ve lint; Android 10/14 üzerinde ses–görüntü birleştirme/çözme, kuyruk/yeniden deneme ve açılış testleri; imzalı final APK üzerinde Android 14 cihaz testleri; imza sertifikası doğrulaması.
            Önceki test sürümünün gerçek telefonda sesli video indirdiği kullanıcı tarafından doğrulandı. Yeni sürümün gerçek YouTube testi cihazda ayrıca yapılmalıdır.

            APK, SHA256SUMS.txt ve cipher alt modülünü içeren kaynak kod arşivi aşağıdadır. Depo özel olduğu için GitHub hesabınızla giriş yapmanız gerekir.
            MP3 dönüştürme, canlı yayın kaydı ve bayt düzeyinde kaldığı yerden devam henüz desteklenmez.

            Commit: ${{ github.sha }}
            Build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            indir-gitsin-*.apk
            indir-gitsin-*-source.zip
            SHA256SUMS.txt
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RELEASE_STORE_FILE"
