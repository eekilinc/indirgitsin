name: Hata bildirimi
description: Tekrarlanabilir bir uygulama hatası bildirin.
title: "[Hata] "
body:
  - type: markdown
    attributes:
      value: "Parola, token, özel video bağlantısı veya kişisel bilgi paylaşmayın. Güvenlik açıkları için Security → Report a vulnerability kullanın."
  - type: input
    id: version
    attributes:
      label: Uygulama sürümü
      placeholder: "1.1.1 final / test sürümü"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Telefon ve Android sürümü
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tekrarlama adımları ve beklenen sonuç
      description: "Kalite, format, ağ türü ve görünen hata metnini ekleyin. Telifli medya dosyası yüklemeyin."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Gerçekleşen sonuç
    validations:
      required: true
